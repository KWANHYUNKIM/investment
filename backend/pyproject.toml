[project]
name = "investment-backend"
version = "0.1.0"
description = "FastAPI backend (layered) for the investment dashboard"
requires-python = ">=3.10"
# 런타임 의존성은 requirements.txt 로 관리(핀 고정). 개발용은 [optional] 참고.

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# src 레이아웃 — 패키지는 src/ 아래에만 있다. 덕분에 tests/ 나 data/ 가 실수로
# 배포 패키지에 섞이지 않고, `pip install -e .` 이 이름 충돌 없이 동작한다.
where = ["src"]

[tool.pytest.ini_options]
# backend/ 에서 `pytest` 만 쳐도 src/ 의 app·scripts 를 찾도록 경로 추가(PYTHONPATH 불필요).
pythonpath = ["src"]
testpaths = ["tests"]
