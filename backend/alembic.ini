# Alembic configuration.
#
# NOTE: this file is read with the OS locale encoding (cp949 on Windows), so it
# must stay ASCII-only. The Korean rationale lives in alembic/env.py, which
# Python reads as UTF-8.
#
# The database URL is deliberately absent: env.py reads it from app.core.config
# so connection details exist in exactly one place and never land in git.
[alembic]
script_location = alembic
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = Asia/Seoul

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
